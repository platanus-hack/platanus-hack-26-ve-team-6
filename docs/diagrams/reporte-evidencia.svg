<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Niveles de evidencia en un reporte de Gotchu">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e7147d"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="#fffefa" stroke="#d9d4d8"/>
<text x="32" y="46" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e7147d" text-anchor="start" letter-spacing="3">CÓMO LEER UN REPORTE</text>
<text x="32" y="74" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#191923" text-anchor="start" letter-spacing="0">Cada hallazgo dice qué sabemos y qué no</text>
<rect x="32" y="105" width="300" height="150" rx="12" fill="#e7147d" stroke="#e7147d" stroke-width="2"/>
<text x="54" y="145" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fffefa" text-anchor="start" letter-spacing="0">Confirmado</text>
<text x="54" y="182" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#fffefa" text-anchor="start" letter-spacing="0">Gotchu observó el hecho directamente.</text>
<text x="54" y="222" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#fffefa" text-anchor="start" letter-spacing="0">Ejemplo: falta una cabecera de seguridad.</text>
<rect x="350" y="105" width="300" height="150" rx="12" fill="#fde7f1" stroke="#e7147d" stroke-width="2"/>
<text x="372" y="145" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#191923" text-anchor="start" letter-spacing="0">Indicio</text>
<text x="372" y="182" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#191923" text-anchor="start" letter-spacing="0">La evidencia apunta al riesgo, sin probarlo.</text>
<text x="372" y="222" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b5a66" text-anchor="start" letter-spacing="0">Ejemplo: un paquete con una versión vulnerable.</text>
<rect x="668" y="105" width="300" height="150" rx="12" fill="#fffefa" stroke="#191923" stroke-width="2" stroke-dasharray="6 5"/>
<text x="690" y="145" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#191923" text-anchor="start" letter-spacing="0">Desconocido</text>
<text x="690" y="182" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#191923" text-anchor="start" letter-spacing="0">Gotchu no revisó esta parte.</text>
<text x="690" y="222" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b5a66" text-anchor="start" letter-spacing="0">No es limpio. No es una garantía.</text>
<rect x="32" y="285" width="6" height="66" rx="3" fill="#e7147d"/><text x="52" y="308" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#191923" text-anchor="start" letter-spacing="0">Severidad</text>
<text x="52" y="334" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b5a66" text-anchor="start" letter-spacing="0">Impacto si el riesgo es real. Puede quedar sin evaluar.</text>
<rect x="350" y="285" width="6" height="66" rx="3" fill="#e7147d"/><text x="370" y="308" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#191923" text-anchor="start" letter-spacing="0">Confianza</text>
<text x="370" y="334" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b5a66" text-anchor="start" letter-spacing="0">Fuerza de la evidencia.</text>
<rect x="668" y="285" width="6" height="66" rx="3" fill="#e7147d"/><text x="688" y="308" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#191923" text-anchor="start" letter-spacing="0">Explotabilidad</text>
<text x="688" y="334" font-family="Saira, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b5a66" text-anchor="start" letter-spacing="0">Desconocida. Gotchu no intenta explotar.</text>
</svg>
