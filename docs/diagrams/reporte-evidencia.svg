<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Un hallazgo con evidencia y un siguiente paso</title>
  <desc id="desc">Ejemplo ilustrativo, no un análisis real. Una respuesta HTTPS no incluye Content-Security-Policy: severidad baja, confianza observada y explotabilidad desconocida. El informe enlaza la respuesta y recomienda revisar la política. Distingue los hechos observados de los indicios y de la cobertura desconocida.</desc>
  <rect x="1" y="1" width="798" height="498" rx="16" fill="#fffefa" stroke="#e3dfe2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="41" font-size="12" font-weight="700" letter-spacing="2" fill="#bd1067">EL RESULTADO</text>
    <text x="32" y="76" font-size="25" font-weight="700" fill="#191923">Qué encontró, qué lo prueba y qué hacer.</text>

    <rect x="32" y="104" width="736" height="230" rx="12" fill="#ffffff" stroke="#d9d4d8"/>
    <path d="M32 116A12 12 0 0 1 44 104H756A12 12 0 0 1 768 116V145H32Z" fill="#f5f2f4"/>
    <text x="52" y="131" font-size="13" font-weight="600" letter-spacing="1" fill="#5b5a66">HALLAZGO HTTPS · EJEMPLO ILUSTRATIVO</text>
    <text x="52" y="180" font-size="23" font-weight="700" fill="#191923">Respuesta sin cabecera CSP</text>
    <text x="52" y="209" font-size="16" fill="#5b5a66">Severidad baja · Confianza observada · Explotabilidad desconocida</text>
    <path d="M52 230H748" stroke="#e3dfe2"/>
    <text x="52" y="259" font-size="15" font-weight="700" fill="#191923">EVIDENCIA</text>
    <text x="210" y="259" font-size="16" fill="#493543">GET / → respuesta sin Content-Security-Policy</text>
    <text x="52" y="291" font-size="15" font-weight="700" fill="#191923">SIGUIENTE PASO</text>
    <text x="210" y="291" font-size="16" fill="#493543">Revisar y configurar la política de esa respuesta.</text>
    <text x="52" y="318" font-size="14" fill="#5b5a66">La observación se limita a la respuesta revisada.</text>

    <rect x="32" y="358" width="232" height="110" rx="10" fill="#fcebf3"/>
    <text x="48" y="390" font-size="20" font-weight="700" fill="#8e144f">Observado</text>
    <text x="48" y="418" font-size="16" fill="#493543">Hecho visto directamente.</text>
    <text x="48" y="443" font-size="15" fill="#5b5a66">Ej.: una cabecera ausente.</text>

    <rect x="284" y="358" width="232" height="110" rx="10" fill="#f5f2f4"/>
    <text x="300" y="390" font-size="20" font-weight="700" fill="#191923">Indicio</text>
    <text x="300" y="418" font-size="16" fill="#493543">Riesgo por comprobar.</text>
    <text x="300" y="443" font-size="15" fill="#5b5a66">Ej.: dependencia vulnerable.</text>

    <rect x="536" y="358" width="232" height="110" rx="10" fill="#ffffff" stroke="#b6adb4" stroke-dasharray="5 4"/>
    <text x="552" y="390" font-size="20" font-weight="700" fill="#191923">Desconocido</text>
    <text x="552" y="418" font-size="16" fill="#493543">Sin cobertura suficiente.</text>
    <text x="552" y="443" font-size="15" fill="#5b5a66">Ej.: rutas con autenticación.</text>
  </g>
</svg>
