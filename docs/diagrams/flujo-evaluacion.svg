<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">De tu aplicación a un informe con evidencia</title>
  <desc id="desc">Puedes aportar código desde una carpeta o GitHub, una web HTTPS autorizada o ambos. Gotchu analiza las entradas y genera un informe con evidencia y recomendaciones. Después puedes preparar una corrección revisable o programar nuevas evaluaciones.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#bd1067"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="458" rx="16" fill="#fffefa" stroke="#e3dfe2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="41" font-size="12" font-weight="700" letter-spacing="2" fill="#bd1067">ENTRADAS → ANÁLISIS → RESULTADO</text>
    <text x="32" y="76" font-size="25" font-weight="700" fill="#191923">Empieza con código, una web o ambos.</text>

    <g fill="none" stroke="#bd1067" stroke-width="2" marker-end="url(#arrow)">
      <path d="M242 161H273V211H308"/>
      <path d="M242 263H273V211" marker-end="none"/>
      <path d="M492 211H542"/>
      <path d="M652 300V333H220V354"/>
      <path d="M652 333H580V354"/>
    </g>

    <rect x="32" y="120" width="210" height="82" rx="10" fill="#ffffff" stroke="#d9d4d8"/>
    <text x="50" y="153" font-size="21" font-weight="650" fill="#191923">Código fuente</text>
    <text x="50" y="180" font-size="16" fill="#5b5a66">Carpeta o GitHub</text>
    <rect x="32" y="222" width="210" height="82" rx="10" fill="#ffffff" stroke="#d9d4d8"/>
    <text x="50" y="255" font-size="21" font-weight="650" fill="#191923">Web HTTPS</text>
    <text x="50" y="282" font-size="16" fill="#5b5a66">Alcance autorizado</text>

    <rect x="310" y="141" width="182" height="140" rx="12" fill="#191923"/>
    <path d="M330 163H337M330 163V170M472 163H465M472 163V170M330 259H337M330 259V252M472 259H465M472 259V252" fill="none" stroke="#f177b5" stroke-width="2"/>
    <text x="401" y="200" text-anchor="middle" font-size="25" font-weight="700" fill="#fffefa">Gotchu</text>
    <text x="401" y="229" text-anchor="middle" font-size="16" fill="#e1dbe0">Analiza y reúne</text>
    <text x="401" y="251" text-anchor="middle" font-size="16" fill="#e1dbe0">la evidencia</text>

    <rect x="544" y="120" width="224" height="184" rx="12" fill="#fcebf3" stroke="#e8a5c6"/>
    <text x="564" y="156" font-size="22" font-weight="700" fill="#191923">Tu informe</text>
    <path d="M564 174H748" stroke="#e8a5c6"/>
    <g font-size="17" fill="#493543">
      <text x="564" y="202">Hallazgos y evidencia</text>
      <text x="564" y="230">Cobertura y límites</text>
      <text x="564" y="258">Recomendaciones</text>
    </g>
    <text x="564" y="285" font-size="14" fill="#8e144f">Disponible en el dashboard</text>

    <rect x="32" y="356" width="356" height="76" rx="10" fill="#ffffff" stroke="#d9d4d8"/>
    <text x="50" y="386" font-size="20" font-weight="650" fill="#191923">Prepara una corrección</text>
    <text x="50" y="412" font-size="16" fill="#5b5a66">Cambio privado para revisar y validar</text>
    <rect x="412" y="356" width="356" height="76" rx="10" fill="#ffffff" stroke="#d9d4d8"/>
    <text x="430" y="386" font-size="20" font-weight="650" fill="#191923">Activa la vigilancia</text>
    <text x="430" y="412" font-size="16" fill="#5b5a66">Revisiones programadas y alertas</text>
  </g>
</svg>
