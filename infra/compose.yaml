x-hardened-service: &hardened-service
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,uid=${GOTCHU_CONTAINER_UID:-1000},gid=${GOTCHU_CONTAINER_GID:-1000}
  pids_limit: 100

x-disabled-service: &disabled-service
  <<: *hardened-service
  image: node:24.18.1-bookworm-slim
  entrypoint: ["node", "-e"]
  restart: "no"
  mem_limit: 256m
  cpus: 0.5

services:
  postgres:
    # PostgreSQL 17.11 Bookworm, pinned for reproducible local development.
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    user: "999:999"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/infra-local-setup.sh first}
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/infra-local-setup.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/infra-local-setup.sh first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    command: ["postgres", "-c", "listen_addresses=0.0.0.0"]
    ports:
      - name: postgres-local
        target: 5432
        published: ${POSTGRES_HOST_PORT:-55432}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
      - local-data-host
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=999,gid=999
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    # Redis 7.4.11 Bookworm, pinned for reproducible local development.
    image: redis:7.4.11-bookworm@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/infra-local-setup.sh first}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    ports:
      - name: redis-local
        target: 6379
        published: ${REDIS_HOST_PORT:-56379}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - redis-data:/data
    networks:
      - data
      - local-data-host
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  web:
    <<: *hardened-service
    profiles: [web]
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      GOTCHU_AUTH_MODE: ${GOTCHU_AUTH_MODE:-development}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?run scripts/infra-local-setup.sh first}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      GOTCHU_GITHUB_READER_APP_FILE: ${GOTCHU_GITHUB_READER_APP_FILE:-}
      GOTCHU_GITHUB_READER_APP_CREDENTIALS_FILE: ${GOTCHU_GITHUB_READER_APP_CREDENTIALS_FILE:-}
      GOTCHU_GITHUB_READER_INSTALLATION_ID: ${GOTCHU_GITHUB_READER_INSTALLATION_ID:-}
      GOTCHU_GITHUB_APP_SLUG: ${GOTCHU_GITHUB_APP_SLUG:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
      GOTCHU_DEMO_ENABLED: ${GOTCHU_DEMO_ENABLED:-false}
      GOTCHU_EVENT_SIGNING_KEYS_JSON: ${GOTCHU_EVENT_SIGNING_KEYS_JSON:-}
      GOTCHU_API_DATABASE_URL: postgresql://${GOTCHU_API_DB_USERNAME:?run scripts/infra-local-setup.sh first}:${GOTCHU_API_DB_PASSWORD:?run scripts/infra-local-setup.sh first}@postgres:5432/${POSTGRES_DB:?run scripts/infra-local-setup.sh first}
      GOTCHU_INGEST_DATABASE_URL: postgresql://${GOTCHU_INGEST_DB_USERNAME:?run scripts/infra-local-setup.sh first}:${GOTCHU_INGEST_DB_PASSWORD:?run scripts/infra-local-setup.sh first}@postgres:5432/${POSTGRES_DB:?run scripts/infra-local-setup.sh first}
      PORT: 3000
      HOST: 0.0.0.0
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(async (response) => { const body = await response.json(); const ready = response.ok && body.ready === true; if (!ready) console.error(JSON.stringify(body)); process.exit(ready ? 0 : 1); }).catch((error) => { console.error(error.name); process.exit(1); })"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: "${GOTCHU_CONTAINER_UID:-1000}:${GOTCHU_CONTAINER_GID:-1000}"
    mem_limit: 512m
    cpus: 1.0
    ports:
      - name: web-local
        target: 3000
        published: ${WEB_HOST_PORT:-3000}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ${GOTCHU_STATE_DIR:-../.gotchu}/github:/run/secrets/github:ro
    networks:
      control-plane: {}
      data: {}
      web-egress:
        gw_priority: 100

  coordinator:
    <<: *hardened-service
    profiles: [coordinator]
    build:
      context: ..
      dockerfile: Dockerfile
      target: coordinator
    restart: unless-stopped
    init: true
    environment:
      # Self-host is a local development profile: the scanner bridge is private to Docker's host gateway.
      NODE_ENV: development
      GOTCHU_COORDINATOR_DATABASE_URL: postgresql://${GOTCHU_COORDINATOR_DB_USERNAME:?run scripts/infra-local-setup.sh first}:${GOTCHU_COORDINATOR_DB_PASSWORD:?run scripts/infra-local-setup.sh first}@postgres:5432/${POSTGRES_DB:?run scripts/infra-local-setup.sh first}
      GOTCHU_REDIS_URL: redis://:${REDIS_PASSWORD:?run scripts/infra-local-setup.sh first}@redis:6379
      GOTCHU_SCANNER_ORIGIN: https://host.docker.internal:${SCANNER_HOST_PORT:-4400}
      GOTCHU_SCANNER_SECRET_FILE: /run/secrets/scanner.secret
      GOTCHU_SCANNER_CA_FILE: /run/secrets/scanner.crt
      GOTCHU_CUSTOMER_DISCOVERY: ${GOTCHU_CUSTOMER_DISCOVERY:-false}
      GOTCHU_ORGANIZATION_IDS: ${GOTCHU_ORGANIZATION_IDS:-}
      GOTCHU_WORKER_URL: ${GOTCHU_WORKER_URL:-}
      GOTCHU_RUN_CAPABILITY_PRIVATE_KEY: ${GOTCHU_RUN_CAPABILITY_PRIVATE_KEY:-}
      GOTCHU_DEMO_ENABLED: ${GOTCHU_DEMO_ENABLED:-false}
      GOTCHU_DEMO_TARGET_ORIGIN:
      PORT: 3003
      GOTCHU_COORDINATOR_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health/ready').then(async (response) => { const body = await response.json(); const ready = response.ok && body.status === 'ready'; if (!ready) console.error(JSON.stringify(body)); process.exit(ready ? 0 : 1); }).catch((error) => { console.error(error.name); process.exit(1); })"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: "${GOTCHU_CONTAINER_UID:-1000}:${GOTCHU_CONTAINER_GID:-1000}"
    extra_hosts:
      - "host.docker.internal=${SCANNER_HOST_GATEWAY:-host-gateway}"
    volumes:
      - ${GOTCHU_STATE_DIR:-../.gotchu}/scanner.secret:/run/secrets/scanner.secret:ro
      - ${GOTCHU_STATE_DIR:-../.gotchu}/scanner.crt:/run/secrets/scanner.crt:ro
    mem_limit: 768m
    cpus: 1.0
    ports:
      - name: coordinator-local
        target: 3003
        published: ${COORDINATOR_HOST_PORT:-3003}
        host_ip: 127.0.0.1
        protocol: tcp
    networks: [control-plane, data, agent-link, local-app-host]

  gateway:
    <<: *disabled-service
    profiles: [gateway]
    command: ["console.error('apps/gateway run-capability HTTP service is not wired into Compose yet'); process.exit(78)"]
    environment:
      GOTCHU_GATEWAY_DATABASE_URL: postgresql://${GOTCHU_GATEWAY_DB_USERNAME:?run scripts/infra-local-setup.sh first}:${GOTCHU_GATEWAY_DB_PASSWORD:?run scripts/infra-local-setup.sh first}@postgres:5432/${POSTGRES_DB:?run scripts/infra-local-setup.sh first}
      GOTCHU_RUN_CAPABILITY_PUBLIC_KEY: ${GOTCHU_RUN_CAPABILITY_PUBLIC_KEY:-}
      PORT: 3002
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, agent-link]

  agent:
    <<: *disabled-service
    profiles: [agent]
    command: ["console.error('apps/worker isolated agent is not wired into Compose yet'); process.exit(78)"]
    environment:
      PORT: 3001
      HOST: 0.0.0.0
    networks: [agent-link]

  # The self-host installer runs the opt-in executor as a loopback host process.
  executor:
    <<: *disabled-service
    profiles: [executor]
    command: ["console.error('apps/executor is not wired into Compose yet; provider writes are disabled'); process.exit(78)"]
    environment:
      GOTCHU_EXECUTOR_DATABASE_URL: postgresql://${GOTCHU_EXECUTOR_DB_USERNAME:?run scripts/infra-local-setup.sh first}:${GOTCHU_EXECUTOR_DB_PASSWORD:?run scripts/infra-local-setup.sh first}@postgres:5432/${POSTGRES_DB:?run scripts/infra-local-setup.sh first}
    networks: [control-plane, data]

  scanner-boundary:
    <<: *disabled-service
    profiles: [scanner]
    command: ["console.error('scanner runner is not wired into Compose yet'); process.exit(78)"]
    networks: [scanner-boundary]

volumes:
  postgres-data:
  redis-data:

networks:
  data:
    internal: true
  local-data-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  local-app-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  control-plane:
    internal: true
  web-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
  agent-link:
    internal: true
  scanner-boundary:
    internal: true
