AWSTemplateFormatVersion: '2010-09-09'
Description: Gotchu release storage and branch-bound GitHub to Lightsail delivery
Parameters:
  OidcSubject:
    Type: String
    Description: Exact repository and prod ref subject returned by GitHub's configured OIDC template
  ManagedInstanceId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^mi-[a-f0-9]{17}$'
Conditions:
  Registered: !Not [!Equals [!Ref ManagedInstanceId, '']]
Resources:
  Releases:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub gotchu-prod-releases-${AWS::AccountId}-${AWS::Region}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ReleaseRetention
            Status: Enabled
            Prefix: releases/
            ExpirationInDays: 30
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags: [{Key: Project, Value: gotchu}, {Key: Environment, Value: production}]
  ReleasePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Releases
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Releases.Arn, !Sub '${Releases.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Sid: RequireConditionalCreation
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${Releases.Arn}/releases/*'
            Condition: {StringNotEquals: {'s3:if-none-match': '*'}}
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gotchu-production-managed-host
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ssm.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: ReadGotchuReleases
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${Releases.Arn}/releases/*'
      Tags: [{Key: Project, Value: gotchu}]
  InstallDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: Gotchu-InstallProductionRelease
      DocumentType: Command
      DocumentFormat: JSON
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: Install one checksummed Gotchu release using the independently installed host control
        parameters:
          Release:
            type: String
            allowedPattern: '^[a-f0-9]{40}-[0-9]{1,20}-[0-9]{1,5}$'
            interpolationType: ENV_VAR
          Checksum:
            type: String
            allowedPattern: '^[a-f0-9]{64}$'
            interpolationType: ENV_VAR
        mainSteps:
          - action: aws:runShellScript
            name: install
            precondition: {StringEquals: [platformType, Linux]}
            inputs:
              timeoutSeconds: '1200'
              runCommand: ['/usr/local/sbin/gotchu-install-release "$SSM_Release" "$SSM_Checksum"']
      Tags: [{Key: Project, Value: gotchu}]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gotchu-github-production-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref OidcSubject
      Policies:
        - PolicyName: DeliverGotchuRelease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${Releases.Arn}/releases/*'
              - !If
                - Registered
                - Effect: Allow
                  Action: ssm:SendCommand
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${InstallDocument}'
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:managed-instance/${ManagedInstanceId}'
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
      Tags: [{Key: Project, Value: gotchu}]
Outputs:
  ReleaseBucket: {Value: !Ref Releases}
  HostRole: {Value: !Ref HostRole}
  DeployRole: {Value: !GetAtt DeployRole.Arn}
  InstallDocument: {Value: !Ref InstallDocument}
