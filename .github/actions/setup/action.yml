name: Set up workspace
description: Install pnpm, Node and the locked workspace dependencies, optionally building every package.
inputs:
  build:
    description: Run `pnpm build` after installing.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
      with:
        version: 11.21.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24.18.1
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
        package-manager-cache: false
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.build == 'true'
      run: pnpm build
      shell: bash
