name: Deploy production
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package and verify the runtime outside the checkout
        run: |
          infra/aws/package-release.sh "$RUNNER_TEMP/release.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum release.tar.gz > release.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/release.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://gotchu.kevinbravo.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify archive integrity and current prod head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check release.tar.gz.sha256
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gotchu-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Publish an immutable release and wait for the host result
        env:
          RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
          MANAGED_INSTANCE: ${{ vars.AWS_MANAGED_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          checksum=$(sha256sum release.tar.gz | cut -d' ' -f1)
          aws s3api put-object --bucket "$RELEASE_BUCKET" --key "releases/$release.tar.gz" --body release.tar.gz --if-none-match '*' --server-side-encryption AES256 >/dev/null
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          command=$(aws ssm send-command --document-name Gotchu-InstallProductionRelease --document-version 1 --instance-ids "$MANAGED_INSTANCE" --parameters "Release=$release,Checksum=$checksum" --timeout-seconds 60 --query Command.CommandId --output text)
          echo "SSM command: $command" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 150); do
            if status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$MANAGED_INSTANCE" --query Status --output text 2>command-error.log); then
              case "$status" in
                Success) echo "Installed release: $release" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *) aws ssm get-command-invocation --command-id "$command" --instance-id "$MANAGED_INSTANCE" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'; exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist command-error.log; then
              cat command-error.log >&2; exit 1
            fi
            sleep 10
          done
          echo 'Host outcome is unknown. Reconcile the SSM command before retrying.' >&2
          exit 1
