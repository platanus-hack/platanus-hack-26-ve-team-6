name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 -B infra/aws/test-release-archive.py
      - run: python3 -B infra/aws/test-release-state.py
      - run: python3 -B infra/aws/test-maintenance.py
      - name: Install Chromium for landing regression tests
        run: pnpm --filter @gotchu/web exec playwright install --with-deps chromium
      - name: Verify desktop and mobile landing behavior
        run: pnpm --filter @gotchu/web test:design --workers=2
      - run: scripts/infra-local-setup.sh
      - run: scripts/infra-compose-validate.sh

  live-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Boot Postgres and Redis in an isolated Compose project
        run: scripts/infra-live-check.sh
      - name: Run real Postgres database and backend integration tests
        run: pnpm --filter @gotchu/database test:postgres
      - name: Verify authenticated gateway and isolated HTTP worker against Postgres
        run: pnpm --filter @gotchu/gateway test:postgres
      - name: Verify independent executor retry and reconciliation ledger against Postgres
        run: pnpm --filter @gotchu/executor test:postgres
      - name: Verify assessment delivery fencing and reserved monitoring capacity
        run: pnpm --filter @gotchu/coordinator test:live
      - name: Verify signed intake, recovery and real controlled source/HTTP assessments
        run: pnpm test:integration

  prod-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'prod'
    runs-on: ubuntu-24.04
    steps:
      - name: Require promotion from this repository's main branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_BRANCH" = main
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
