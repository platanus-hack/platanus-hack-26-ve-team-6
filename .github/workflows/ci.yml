name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: scripts/infra-local-setup.sh
      - run: scripts/infra-compose-validate.sh

  live-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Boot Postgres and Redis in an isolated Compose project
        run: scripts/infra-live-check.sh
      - name: Run real Postgres database and backend integration tests
        run: pnpm --filter @gotchu/database test:postgres
