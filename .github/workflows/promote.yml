name: Prepare production promotion
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  propose:
    if: >-
      github.repository == '0bkevin/gotchu' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # API-only: never execute source or download artifacts from workflow_run.
      - name: Open or update the main to prod release PR
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$TESTED_SHA" || exit 0
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/prod...main" --jq .ahead_by)
          test "$ahead" -gt 0 || exit 0
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base prod --head main --state open --json number --jq '.[0].number // empty')
          body="$RUNNER_TEMP/promotion.md"
          cat >"$body" <<EOF
          ## Summary

          Promote main ($TESTED_SHA) to production after successful CI.

          main → approved merge into prod → verified AWS release

          ## Evidence

          - Main passed CI. Required PR checks still apply to its current head.
          - Production reruns CI and verifies host readiness before deployment succeeds.

          ## Merge Danger

          **Door:** two-way for application releases with unchanged migration state.

          **Blast Radius:** production

          Merging starts deployment. Database changes require operator recovery if readiness fails.
          EOF
          if test -n "$number"; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base prod --head main --title 'Release main to production' --body-file "$body"
          fi
